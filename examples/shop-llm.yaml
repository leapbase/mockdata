# Same shape as shop.yaml, but review text is written by an LLM.
# The provider, model and keys come from .env (see .env.example): AI_PROVIDER,
# <PROVIDER>_MODEL, OLLAMA_BASE_URL, ANTHROPIC_API_KEY, OPENAI_API_KEY.
# To pin them in this file instead, add e.g.:
#   llm: { provider: anthropic, model: <model id> }
seed: 42
tables:
  products:
    rows: 5
    columns:
      id: { type: integer, primaryKey: true }
      name: { type: string, faker: commerce.productName }
  reviews:
    rows: 12
    columns:
      id: { type: integer, primaryKey: true }
      product_id: { type: integer, ref: products.id }
      rating: { type: integer, min: 1, max: 5 }
      body:
        type: string
        llm: { prompt: "A one or two sentence customer review whose tone matches the rating (1 = angry, 5 = delighted)" }
